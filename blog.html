---
layout: null
---
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog | Ian Amit</title>
    <link rel="stylesheet" href="/assets/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

    <nav class="navbar">
        <div class="container nav-container">
            <a href="/" class="logo">iamit<span class="cursor">_</span></a>
            <ul class="nav-links">
                <li><a href="/#about">About</a></li>
                <li><a href="/#experience">Experience</a></li>
                <li><a href="/blog.html" class="btn-blog">Blog</a></li>
            </ul>
        </div>
    </nav>

    <section class="section">
        <div class="container">
            <h1 class="section-title">Intelligence Log</h1>
            
            <div class="blog-list">
                {% for post in site.posts %}
                <div class="card timeline-item" style="margin-bottom: 30px; border-left: 2px solid #10b981; padding-left: 20px;">
                    <span class="date" style="color: #10b981; font-family: 'JetBrains Mono';">{{ post.date | date: "%Y-%m-%d" }}</span>
                    <h2 style="margin: 10px 0;">
                        <a href="{{ post.url }}" style="text-decoration: none; color: white;">{{ post.title }}</a>
                    </h2>
                    <p style="color: #94a3b8;">{{ post.excerpt | strip_html | truncatewords: 30 }}</p>
                    <a href="{{ post.url }}" class="more-link">Read Entry ></a>
                </div>
                {% endfor %}
            </div>

        </div>
    </section>

</body>
</html>
