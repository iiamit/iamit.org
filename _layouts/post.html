<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }} | Ian Amit</title>
    <link rel="stylesheet" href="/assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

    <nav class="navbar">
        <div class="container nav-container">
            <a href="/" class="logo">iamit<span class="cursor">_</span></a>
            
            <div class="menu-toggle" id="mobile-menu">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </div>

            <ul class="nav-links">
                <li><a href="/#about">About</a></li>
                <li><a href="/#experience">Experience</a></li>
                <li><a href="/#speaking">Speaking</a></li>
                <li><a href="/blog/" class="btn-blog">Blog</a></li>
            </ul>
        </div>
    </nav>

    <article class="section">
        <div class="container" style="max-width: 800px;">
            <header class="post-header">
                <p class="overline">{{ page.date | date: "%B %d, %Y" }}</p>
                <h1 class="post-title">{{ page.title }}</h1>
            </header>
            
            <div class="content-block post-content">
                {{ content }}
            </div>
            
            <div class="post-footer">
                <a href="/blog/" class="btn-outline">&larr; Return to Blog</a>
            </div>
        </div>
    </article>

    <footer>
        <div class="container footer-content">
            <p>&copy; 2026 Ian Amit. Terminals never sleep.</p>
        </div>
    </footer>
<script>
    const menu = document.querySelector('#mobile-menu');
    const navLinks = document.querySelector('.nav-links');

    menu.addEventListener('click', function() {
        menu.classList.toggle('is-active');
        navLinks.classList.toggle('active');
    });
    
    // Optional: Close menu when a link is clicked
    document.querySelectorAll('.nav-links a').forEach(n => n.addEventListener('click', () => {
        menu.classList.remove('is-active');
        navLinks.classList.remove('active');
    }));
</script>
</body>
</html>
